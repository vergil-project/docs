name: CD

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docs:
    uses: vergil-project/vergil-actions/.github/workflows/cd-docs.yml@v2.1
    permissions:
      contents: write
    secrets:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
    with:
      # Regenerate the roadmap and activity pages before each deploy, as the
      # nightly cd-docs-refresh.yml does, so a push never republishes the
      # committed copies. Keep the two commands identical.
      pre-deploy-command: >-
        vrg-roadmap > docs/site/docs/roadmap.md &&
        vrg-activity-log --out-dir docs/site/docs/activity
