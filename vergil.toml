[project]
repository-type = "documentation"
versioning-scheme = "none"
branching-model = "docs-single-branch"
release-model = "none"

[ci]
versions = ["latest"]
integration-tests = false

[publish]
release = false
docs = true

[dependencies]
vergil = "v2.1"

# Generated reporting pages — refreshed from GitHub issue/epic data by the
# roadmap-refresh workflow; exempt from markdownlint (machine-formatted).
[markdownlint]
ignore = [
  "docs/site/docs/roadmap.md",
  "docs/site/docs/activity.md",
]
